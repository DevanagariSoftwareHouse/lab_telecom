[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lab-telecom"
version = "0.0.0"
description = "Laboratorios reproduziveis de Engenharia de Telecomunicacoes"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "matplotlib>=3.7"]

[tool.setuptools]
packages = ["lab_telecom"]
py-modules = ["startup"]
